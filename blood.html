<!DOCTYPE html>

<html>
    <head>
        <title>Blood Bank Registration form </title>

    </head>
  
    <Body> 
        <h1 class="t">Blood Donation Form</h1>
        
    <br>
        
        <form action=""  method="GET">
            <div>
            <label>First name:</label>
            <input type="Text" id="fname" name="fname" placeholder="">
            <div></div>
            <br>
        
            <label>Last name:</label>
            <input type="Text" id="1name" name="1name" placeholder="">
        </div>
        <br>
        <div>
         <label>Email:</label> 
         <input type="">
    </div>
    <br>
    <div>
        <label>Address:</label> 
        <textarea class="add"></textarea>
    </div>

        <br>
        city<select>
            <option>Rajkot</option>
            <option>Dehli</option>
            <option>Mumbai</option>
            <option>Punja</option>
        </select>
        <br><br>
        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="" id="" name="" placeholder="" required>
        </div>
    </div>
    <br>

    <div class="row">
        <div class="form-group">
            <label for="age">Age *</label>
            <input type="" id="" name="" min="" max="" placeholder="" required>
        </div>
        <div class="form-group">
            <label>Gender *</label>
            <div class="radio-group">
                <label class="radio-item"><input type="radio" name="gender" value="male" required> Male</label>
                <label class="radio-item"><input type="radio" name="gender" value="female"> Female</label>
                <label class="radio-item"><input type="radio" name="gender" value="other"> Other</label>              
    </div>
    <br>

    <div class="form-group">
        <label for="bloodgroup">Blood Group *</label>
        <select id="" name="" required>
            <option value="" disabled selected>-- Select Your Blood Group --</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>
    </div>
    <br>

    <div class="form-group">
        <label for="lastdonation">Last Blood Donation Date (If any)</label>
        <input type="" id="" name="">
    </div>
    <br>

    <div class="form-group">
        <label for="medical_history">Major Medical Conditions / Diseases (If any)</label>
        <textarea id="medical_history" name="medical_history" rows="3" placeholder=""></textarea>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="" name="" required>
        <label for="consent">I confirm that I am fit to donate blood and the information provided above is correct. *</label>
    </div>

    <button type="submit">Register as Donor</button>
    <Button>reset</Button>

        </form>
    </body>
    
</html>
